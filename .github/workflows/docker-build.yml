name: Build & push image

# Builds the sentinel Docker image and pushes it to the GitHub Container
# Registry (GHCR) so it can be pulled from anywhere:
#   docker pull ghcr.io/open-stash/sentinel:latest
#
# Auth uses the built-in GITHUB_TOKEN — no secrets to configure. The first
# push creates the package; make it public in the repo's Packages settings if
# you want to pull without logging in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # open-stash/sentinel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only push on real events — a fork PR (if ever added) can't push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
